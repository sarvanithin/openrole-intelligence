name: Platform CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Audit runtime dependencies
        run: pip-audit --require-hashes -r requirements.lock
      - name: Lint production platform
        run: |
          ruff check src/fortune_intel tests/test_api.py tests/test_ats_discovery.py tests/test_bulk_source_approval.py tests/test_company_merge.py tests/test_connectors.py tests/test_coverage.py tests/test_coverage_audit.py tests/test_discovery_pipeline.py tests/test_discovery_priority.py tests/test_dol_importer.py tests/test_migrations.py tests/test_network_discovery.py tests/test_oracle_recruiting_connector.py tests/test_public_api.py tests/test_reassessment.py tests/test_repository.py tests/test_scheduler.py tests/test_sec_importer.py tests/test_sec_website_importer.py tests/test_source_approval.py tests/test_source_importer.py tests/test_source_sync.py tests/test_sponsorship.py tests/test_website_importer.py tests/test_wikidata_website_importer.py tests/test_workday_connector.py
          ruff format --check src/fortune_intel tests/test_api.py tests/test_ats_discovery.py tests/test_bulk_source_approval.py tests/test_company_merge.py tests/test_connectors.py tests/test_coverage.py tests/test_coverage_audit.py tests/test_discovery_pipeline.py tests/test_discovery_priority.py tests/test_dol_importer.py tests/test_migrations.py tests/test_network_discovery.py tests/test_oracle_recruiting_connector.py tests/test_public_api.py tests/test_reassessment.py tests/test_repository.py tests/test_scheduler.py tests/test_sec_importer.py tests/test_sec_website_importer.py tests/test_source_approval.py tests/test_source_importer.py tests/test_source_sync.py tests/test_sponsorship.py tests/test_website_importer.py tests/test_wikidata_website_importer.py tests/test_workday_connector.py
      - name: Test
        run: pytest -q
      - name: CLI smoke test
        run: |
          python -m fortune_intel.cli --database /tmp/openrole-ci.db init-db
          python -m fortune_intel.cli --database /tmp/openrole-ci.db seed-demo
          python -c "from fortune_intel.api import create_app; assert create_app('/tmp/openrole-ci.db').state.repository.overview()['active_jobs'] == 4"
