name: Legacy Sheets Job Scraper (manual only)

on:
  # This compatibility workflow is deliberately excluded from production and
  # can only be run by an operator who reviews the source scope first.
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode (only 3 companies)'
        required: false
        default: 'false'
        type: boolean

env:
  PYTHON_VERSION: '3.11'

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium
      
      - name: Set up Google credentials
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json
        working-directory: src
      
      - name: Run job scraper
        env:
          COMPANIES_SHEET_ID: ${{ secrets.COMPANIES_SHEET_ID }}
          JOBS_SHEET_ID: ${{ secrets.JOBS_SHEET_ID }}
        run: |
          if [ "${{ github.event.inputs.test_mode }}" = "true" ]; then
            python main.py --test
          else
            python main.py
          fi
        working-directory: src
      
      - name: Clean up credentials
        if: always()
        run: rm -f credentials.json
        working-directory: src
